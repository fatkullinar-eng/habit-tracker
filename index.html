<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Привычки — личный трекер</title>
  <meta name="description" content="Личный трекер привычек: отметки, серии, календарь и статистика.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316a34a'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <span class="brand-name">Привычки</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Разделы">
      <button class="tab is-active" data-view="today">Сегодня</button>
      <button class="tab" data-view="habits">Привычки</button>
      <button class="tab" data-view="calendar">Календарь</button>
      <button class="tab" data-view="stats">Статистика</button>
      <button class="tab" data-view="settings">Настройки</button>
    </nav>

    <main id="app" class="content"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
